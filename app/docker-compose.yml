services:
  flask_app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bv_flask_app
    restart: always
    env_file:
      - ../.env
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=bv_mysql # Override pour pointer vers le container MySQL
    networks:
      - bv_network
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bv_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.bv_app.entrypoints=websecure"
      - "traefik.http.routers.bv_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.bv_app.loadbalancer.server.port=5001"

networks:
  bv_network:
    name: bv_network
    external: true
  traefik_default:
    external: true
