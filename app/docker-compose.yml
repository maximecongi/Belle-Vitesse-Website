services:
  flask_app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bv_flask_app
    restart: always
    env_file:
      - ../.env
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=bv_mysql
    volumes:
      - /srv/bellevitesse/website/static:/app/static
      - /srv/bellevitesse/output:/app/output
      - /srv/bellevitesse/logs:/app/logs
      - /srv/bellevitesse/backups:/app/backups
    networks:
      - bv_network
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # Site principal
      - "traefik.http.routers.bv_app.rule=Host(`bellevitesse.com`)"
      - "traefik.http.routers.bv_app.entrypoints=websecure"
      - "traefik.http.routers.bv_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.bv_app.loadbalancer.server.port=5001"
      - "traefik.http.middlewares.add-header.headers.customRequestHeaders.X-Admin-Token=X-Admin-Token"
      # Admin sur team.bellevitesse.com
      - "traefik.http.routers.bv_admin.rule=Host(`team.bellevitesse.com`)"
      - "traefik.http.routers.bv_admin.entrypoints=websecure"
      - "traefik.http.routers.bv_admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bv_admin.service=bv_app"
      - "traefik.http.routers.bv_admin.middlewares=admin-redirect"
      - "traefik.http.middlewares.admin-redirect.redirectregex.regex=^https://team\\.bellevitesse\\.com/$$"
      - "traefik.http.middlewares.admin-redirect.redirectregex.replacement=https://team.bellevitesse.com/admin"
    ports:
      - "5001:5001"

  # ───── Static File Server (Nginx) ─────
  nginx_static:
    image: nginx:alpine
    container_name: bv_nginx_static
    restart: always
    volumes:
      - /srv/bellevitesse/website/static:/usr/share/nginx/html/static:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # Route /static/ requests to Nginx (higher priority than Flask)
      - "traefik.http.routers.bv_static.rule=Host(`bellevitesse.com`) && PathPrefix(`/static/`)"
      - "traefik.http.routers.bv_static.entrypoints=websecure"
      - "traefik.http.routers.bv_static.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bv_static.priority=100"
      - "traefik.http.services.bv_static.loadbalancer.server.port=80"
      # Also serve static for team.bellevitesse.com
      - "traefik.http.routers.bv_static_admin.rule=Host(`team.bellevitesse.com`) && PathPrefix(`/static/`)"
      - "traefik.http.routers.bv_static_admin.entrypoints=websecure"
      - "traefik.http.routers.bv_static_admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.bv_static_admin.priority=100"
      - "traefik.http.routers.bv_static_admin.service=bv_static"

  # ───── Worker RQ ─────
  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: bv_worker
    restart: always
    env_file:
      - ../.env
    environment:
      - MYSQL_HOST=bv_mysql
    command: rq worker -u redis://bv_redis:6379/1 sql_logs
    volumes:
      - /srv/bellevitesse/logs:/app/logs
    networks:
      - bv_network

  # ───── Serveur MCP Admin (BV-MCP) ─────
  mcp_server:
    build:
      context: ..
      dockerfile: Dockerfile.mcp
    container_name: bv_mcp
    restart: always
    env_file:
      - ../.env
    environment:
      - FLASK_ENV=production
      - MYSQL_HOST=bv_mysql
      - MCP_SERVER_PORT=8080
    volumes:
      - /srv/bellevitesse/output:/app/output
      - /srv/bellevitesse/logs:/app/logs
    networks:
      - bv_network
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      # MCP Server sur mcp.bellevitesse.com
      - "traefik.http.routers.bv_mcp.rule=Host(`mcp.bellevitesse.com`)"
      - "traefik.http.routers.bv_mcp.entrypoints=websecure"
      - "traefik.http.routers.bv_mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.bv_mcp.loadbalancer.server.port=8080"
    ports:
      - "8080:8080"

networks:
  bv_network:
    name: bv_network
    external: true
  traefik_default:
    external: true
