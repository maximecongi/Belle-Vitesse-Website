{% extends "public/layout.html" %}
{% block title %}{{ error_title }} - Belle Vitesse{% endblock %}
{% block content %}
<section class="section-site">
    <div class="main-wrapper">
        <h1 class="title-textual-section">{{ error_title }}</h1>
        <p class="error-description">
            {{ error_message }}
        </p>
        <a href="{{ return_url or url_for('home') }}" class="btn-primary error-link">{{ return_label or 'Return to Home' }}</a>
    </div>
</section>
{% endblock %}
