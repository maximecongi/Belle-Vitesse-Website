{% extends "admin/admin_base.html" %}

{% block title %}Générateur de signature mail{% endblock %}
{% block page_title %}Générateur de signature mail{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/admin-signature-generator.css') }}?v={{ asset_version('css/admin/admin-signature-generator.css') }}">
{% endblock %}

{% block content %}
<div class="sig-editor-layout">
    <!-- FORM -->
    <div class="admin-card">
        <h3 class="u-mt-0 u-mb-3 u-text-lg">Informations</h3>

        <div class="form-group">
            <label class="form-label" for="f-name">Nom complet</label>
            <input type="text" id="f-name" class="form-input"
                value="{{ current_user.firstname }} {{ current_user.lastname }}" oninput="update()">
        </div>

        <div class="form-group">
            <label class="form-label" for="f-job">Poste</label>
            <input type="text" id="f-job" class="form-input" value="{{ current_user.job }}" oninput="update()">
        </div>

        <div class="form-group">
            <label class="form-label" for="f-email">Email (préfixe)</label>
            <div class="u-flex u-align-center">
                <input type="text" id="f-email" class="form-input u-flex-1"
                    value="{{ current_user.mail.split('@')[0] }}" oninput="update()">
                <span class="sig-email-suffix">@bellevitesse.com</span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="f-phone">Téléphone</label>
            <input type="text" id="f-phone" class="form-input" value="{{ current_user.phone }}" oninput="update()">
        </div>
    </div>

    <!-- PREVIEW & CODE -->
    <div>
        <div class="admin-card">
            <h3 class="u-mt-0 u-mb-3 u-text-lg">Aperçu</h3>
            <div class="sig-preview-card">
                <div id="sig-preview" class="sig-preview-container">
                    <!-- Preview will be injected here -->
                </div>
            </div>
        </div>

        <div class="admin-card sig-code-card">
            <div class="u-flex u-justify-between u-align-center u-mb-2">
                <h3 class="u-m-0 u-text-lg">Code HTML</h3>
                <button type="button" class="admin-btn admin-btn-secondary" id="copy-btn" onclick="copyHtml()">Copier le
                    code</button>
            </div>
            <div id="code-output" class="code-output"></div>
        </div>
    </div>
</div>
{% endblock %}
