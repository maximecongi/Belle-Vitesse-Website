{% extends "admin/admin_base.html" %}

{% block title %}Newsletter - Composer{% endblock %}
{% block page_title %}Composer une newsletter{% endblock %}

{% block content %}
<div class="admin-card">
    <form action="{{ url_for('admin_newsletter_compose') }}" method="POST">
        <div class="form-group">
            <label for="subject">Sujet de l'email</label>
            <input type="text" id="subject" name="subject" class="admin-input"
                placeholder="Ex: Belle Vitesse : Des nouveautés pour vous !" value="{{ subject or '' }}" required>
        </div>

        <div class="form-group u-mt-3">
            <label for="body">Message (Texte brute ou HTML basique)</label>
            <textarea id="body" name="body" class="admin-input" rows="15" placeholder="Écrivez votre message ici..."
                required>{{ body or '' }}</textarea>
            <p class="u-text-sm u-text-muted u-mt-1">
                Note : Les retours à la ligne seront automatiquement convertis en sauts de ligne HTML.
            </p>
        </div>

        <div class="form-actions u-mt-4 u-border-top u-pt-3">
            <a href="{{ url_for('admin_newsletter_dashboard') }}" class="admin-btn admin-btn-secondary">Annuler</a>
            <button type="submit" class="admin-btn admin-btn-primary"
                onclick="return confirm('Êtes-vous sûr de vouloir envoyer cette newsletter à TOUS les abonnés ?');">
                Envoyer la campagne
            </button>
        </div>
    </form>
</div>
{% endblock %}
