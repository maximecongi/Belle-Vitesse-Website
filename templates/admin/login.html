<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Belle Vitesse</title>
    {% if config.FLASK_ENV == 'production' %}
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.bundle.css') }}?v={{ asset_version('css/styles.bundle.css') }}">
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/admin/admin.bundle.css') }}?v={{ asset_version('css/admin/admin.bundle.css') }}">
    {% else %}
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/styles.css') }}?v={{ asset_version('css/styles.css') }}">
    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/admin/admin.css') }}?v={{ asset_version('css/admin/admin.css') }}">
    {% endif %}
    <link rel="icon" type="image/png" href="/static/imgs/favicons/favicon-96x96.png" sizes="96x96" />
</head>

<body class="login-page">
    <div class="login-card">
        <img src="{{ url_for('static', filename='imgs/logos_and_name/noir-fond-transparent.png') }}" alt="Belle Vitesse"
            class="login-logo">
        <h1 class="login-title">Dashboard Admin</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="flash-messages flash-{{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <div class="form-group">
                <label for="email" class="form-label">Saisissez votre email pour vous connecter</label>
                <input type="email" name="email" id="email" class="form-input" pattern=".*@(bellevitesse\.com|rvz\.fr)$"
                    title="Seules les adresses @bellevitesse.com et @rvz.fr sont autorisées" placeholder="Email" required
                    autofocus>
            </div>
            <button type="submit" class="login-btn">Recevoir un lien de connexion</button>
        </form>
    </div>
</body>

</html>
