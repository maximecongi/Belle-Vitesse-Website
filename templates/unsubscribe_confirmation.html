<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Belle Vitesse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --grey-1: #151515;
            --white-1: #FFFFFF;
            --white-4: #A1A1A1;
            --yellow-1: #FFC845;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--grey-1);
            color: var(--white-1);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
        }

        .logo {
            width: 300px;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        p {
            color: var(--white-4);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            background-color: #ffc845;
            color: var(--grey-1);
            text-align: center;
            display: inline-block;
            font-size: clamp(0.6rem, 1vw, 1rem);
            font-weight: 600;
            cursor: pointer;
            border-width: initial;
            border-style: none;
            border-color: initial;
            border-image: initial;
            padding: clamp(0.6rem, 1vw, 1.1rem) clamp(1.2rem, 1.2vw, 2.5rem);
            text-decoration: none;
            margin: 4px 2px;
            transition: filter 0.2s linear;
        }

        .btn:hover {
            filter: brightness(0.9);
        }

        .status-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .success {
            color: #4B7F52;
        }

        .error {
            color: #E71D36;
        }

        .info {
            color: var(--yellow-1);
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://www.bellevitesse.com/static/imgs/logos_and_name/blanc-fond-transparent.png"
            alt="Belle Vitesse" class="logo">

        <div class="status-icon {{ status }}">
            {% if status == 'success' %}
            ✓
            {% elif status == 'error' %}
            ✕
            {% else %}
            !
            {% endif %}
        </div>

        <h1>{{ status|replace('success', 'Confirmed')|replace('error', 'Error')|replace('info', 'Information') }}</h1>
        <p>{{ message }}</p>

        <a href="/" class="btn">Back to home</a>
    </div>
</body>

</html>
