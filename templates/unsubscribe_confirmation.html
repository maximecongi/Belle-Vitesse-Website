<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Désinscription - Belle Vitesse</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --grey-1: #151515;
            --white-1: #FFFFFF;
            --white-4: #A1A1A1;
            --yellow-1: #FFC845;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--grey-1);
            color: var(--white-1);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
        }

        .logo {
            width: 200px;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        p {
            color: var(--white-4);
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background-color: var(--yellow-1);
            color: var(--grey-1);
            padding: 1rem 2rem;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 2px;
            transition: transform 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .status-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .success {
            color: #4B7F52;
        }

        .error {
            color: #E71D36;
        }

        .info {
            color: var(--yellow-1);
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://www.bellevitesse.com/static/imgs/logos_and_name/blanc-fond-transparent.png"
            alt="Belle Vitesse" class="logo">

        <div class="status-icon {{ status }}">
            {% if status == 'success' %}
            ✓
            {% elif status == 'error' %}
            ✕
            {% else %}
            !
            {% endif %}
        </div>

        <h1>{{ status|replace('success', 'Confirmé')|replace('error', 'Erreur')|replace('info', 'Information') }}</h1>
        <p>{{ message }}</p>

        <a href="/" class="btn">Retour au site</a>
    </div>
</body>

</html>
