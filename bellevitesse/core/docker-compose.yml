services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - core_net

  flask:
    build: ./flask
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    volumes:
      - ./flask/static/images/airtable:/app/static/images/airtable
    ports:
      - "5000:5000"
    networks:
      - core_net
    depends_on:
      - mysql

  nocodb:
    image: nocodb/nocodb
    env_file:
      - .env
    environment:
      DB_TYPE: "mysql2"
      DB_HOST: "mysql"
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    ports:
      - "8080:8080"
    networks:
      - core_net
    depends_on:
      - mysql

volumes:
  mysqldata:

networks:
  core_net:
