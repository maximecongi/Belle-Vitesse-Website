<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Fond Cyclo Studio identique aux miniatures -->
    <radialGradient id="studioBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F9F9F9" />
      <stop offset="100%" stop-color="#F2F2F2" />
    </radialGradient>

    <!-- Ombre portée générale au sol -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ombre de contact sous les pneus -->
    <radialGradient id="tireContact" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#000000" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Hachures techniques pour le bloc batterie -->
    <pattern id="batteryFins" width="6" height="6" patternTransform="rotate(-28 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1A1A1A" stroke-width="1.5" opacity="0.45" />
    </pattern>

    <!-- Trame subtile pour les mousses de protection du rig -->
    <pattern id="foamGrip" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#1A1A1A" opacity="0.12" />
    </pattern>
  </defs>

  <!-- 1. FOND STUDIO -->
  <rect width="1200" height="800" fill="url(#studioBg)" />

  <!-- Réduction de 10 % de l'image, centrée dans le canvas -->
  <g transform="translate(60 40) scale(0.9)">
    <!-- 2. OMBRES AU SOL (Alignées sur la photo d'origine) -->
    <ellipse cx="560" cy="645" rx="380" ry="24" fill="url(#floorShadow)" />
    <ellipse cx="388" cy="625" rx="75" ry="12" fill="url(#tireContact)" />
    <ellipse cx="772" cy="662" rx="85" ry="14" fill="url(#tireContact)" />

    <!-- 3. GRILLE & LIGNES DE CONSTRUCTION BLUEPRINT (Très subtiles) -->
    <g stroke="#1A1A1A" fill="none" opacity="0.16" stroke-width="1">
      <!-- Lignes d'axes des roues et du rig -->
      <line x1="180" y1="642" x2="980" y2="642" stroke-dasharray="10 6" />
      <line x1="388" y1="80" x2="388" y2="690" stroke-dasharray="6 6" />
      <line x1="772" y1="80" x2="772" y2="690" stroke-dasharray="6 6" />
      <line x1="260" y1="85" x2="840" y2="85" stroke-dasharray="4 8" />

      <!-- Cotes d'empattement (Wheelbase) -->
      <line x1="388" y1="680" x2="772" y2="680" stroke-width="1.5" />
      <polyline points="398,675 388,680 398,685" stroke-width="1.5" />
      <polyline points="762,675 772,680 762,685" stroke-width="1.5" />
      <circle cx="388" cy="528" r="95" stroke-dasharray="3 6" />
      <circle cx="772" cy="548" r="108" stroke-dasharray="3 6" />
    </g>

    <!-- 4. BLUEPRINT DE L'E-BIKE & SON RIG CINÉMA -->
    <g stroke="#181818" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.48">

      <!-- ========================================== -->
      <!-- A. ROUE ARRIÈRE (Supermotard + Rayons)     -->
      <!-- ========================================== -->
      <g transform="translate(388, 528)">
        <!-- Pneu Arrière (Perspective 3/4) -->
        <ellipse cx="6" cy="0" rx="72" ry="92" fill="#EAEAEA" stroke-width="3.5" />
        <ellipse cx="-4" cy="0" rx="70" ry="92" fill="#F5F5F5" stroke-width="2.5" />
        <ellipse cx="-6" cy="0" rx="52" ry="68" stroke-width="3" />
        <ellipse cx="-6" cy="0" rx="46" ry="61" stroke-width="1.5" />

        <!-- Rayons entrecroisés -->
        <g stroke-width="1" opacity="0.65">
          <line x1="-6" y1="0" x2="-6" y2="-61" /><line x1="-6" y1="0" x2="22" y2="-54" />
          <line x1="-6" y1="0" x2="38" y2="-32" /><line x1="-6" y1="0" x2="40" y2="0" />
          <line x1="-6" y1="0" x2="35" y2="35" /><line x1="-6" y1="0" x2="15" y2="56" />
          <line x1="-6" y1="0" x2="-6" y2="61" /><line x1="-6" y1="0" x2="-30" y2="52" />
          <line x1="-6" y1="0" x2="-48" y2="28" /><line x1="-6" y1="0" x2="-52" y2="-5" />
          <line x1="-6" y1="0" x2="-42" y2="-38" /><line x1="-6" y1="0" x2="-24" y2="-56" />
          <line x1="8" y1="-12" x2="-35" y2="-45" /><line x1="8" y1="12" x2="-35" y2="45" />
          <line x1="-18" y1="-12" x2="28" y2="-42" /><line x1="-18" y1="12" x2="28" y2="42" />
        </g>

        <!-- Disque de frein arrière & Couronne -->
        <ellipse cx="-4" cy="0" rx="28" ry="36" stroke-width="2" stroke-dasharray="8 4" fill="#F0F0F0" fill-opacity="0.6" />
        <ellipse cx="-4" cy="0" rx="18" ry="24" stroke-width="1.2" />
        <!-- Moyeu -->
        <ellipse cx="-6" cy="0" rx="10" ry="13" fill="#E0E0E0" stroke-width="2.5" />
      </g>

      <!-- ========================================== -->
      <!-- B. BRAS OSCILLANT, MOTEUR & BATTERIE       -->
      <!-- ========================================== -->
      <g>
        <!-- Jambe de force tubulaire arrière (Relie la boucle arrière à l'axe) -->
        <path d="M 346 355 L 435 488" stroke-width="9" stroke="#181818" />
        <path d="M 346 355 L 435 488" stroke-width="5" stroke="#F5F5F5" />

        <!-- Bras oscillant Aluminium (Swingarm) -->
        <path d="M 368 522 L 495 495 L 498 518 L 372 544 Z" fill="#EFEFEF" stroke-width="2.5" />
        <!-- Renfort interne du bras oscillant -->
        <path d="M 395 523 L 478 505 L 478 514 L 395 532 Z" stroke-width="1.2" />
        <!-- Axe de roue arrière & tendeur de chaîne -->
        <rect x="362" y="523" width="18" height="14" rx="2" fill="#D8D8D8" stroke-width="2" />
        <circle cx="371" cy="530" r="3" fill="#181818" />
        <!-- Chaîne de transmission -->
        <line x1="385" y1="546" x2="508" y2="522" stroke-width="2" stroke-dasharray="4 3" />

        <!-- Sabot moteur inférieur (Skid plate) -->
        <path d="M 505 535 L 555 544 L 635 530 L 650 475 L 625 468 L 545 480 Z" fill="#E2E2E2" stroke-width="2.5" />

        <!-- Bloc Batterie (Avec ailettes de refroidissement diagonales) -->
        <polygon points="535,385 632,375 622,492 542,505" fill="url(#batteryFins)" stroke-width="2.5" />
        <line x1="578" y1="380" x2="628" y2="435" stroke-width="2" />

        <!-- Carter Moteurs & Boîtier Argenté (Forme oblongue verticale caractéristique) -->
        <path d="M 495 450 C 495 425, 538 422, 540 448 L 542 502 C 542 528, 498 530, 496 502 Z" fill="#F2F2F2" stroke-width="2.5" />
        <path d="M 502 454 C 502 435, 532 433, 533 452 L 535 498 C 535 517, 504 519, 503 498 Z" stroke-width="1.2" />
        <!-- Repère bleu/axe sur le carter -->
        <circle cx="508" cy="462" r="4" fill="#181818" />

        <!-- Amortisseur central & biellettes -->
        <path d="M 488 378 L 502 435" stroke-width="6" stroke-dasharray="5 4" />
        <path d="M 535 430 L 575 385" stroke-width="8" stroke="#181818" />
        <path d="M 535 430 L 575 385" stroke-width="4" stroke="#F5F5F5" />
      </g>

      <!-- ========================================== -->
      <!-- C. CARÉNAGES, SELLE & GARDE-BOUE AVANT     -->
      <!-- ========================================== -->
      <g>
        <!-- Garde-boue arrière court -->
        <path d="M 326 358 L 355 348 L 358 358 Z" fill="#E6E6E6" stroke-width="2" />

        <!-- Coque arrière / Flancs latéraux + Selle -->
        <path d="M 350 335 C 420 342, 490 340, 560 305 L 615 275 L 645 345 L 598 408 L 575 375 L 485 382 L 495 455 L 415 445 L 382 365 L 350 355 Z" fill="#EAEAEA" stroke-width="2.8" />
        
        <!-- Lignes de pliage / Arêtes vives du carénage -->
        <path d="M 365 352 L 505 375 L 595 395" stroke-width="1.5" />
        <path d="M 415 445 L 405 368" stroke-width="1.5" />
        <!-- Dessus de selle -->
        <path d="M 355 335 C 430 344, 510 338, 578 292" stroke-width="3.5" />
        <!-- Peg / Slider latéral noir -->
        <rect x="538" y="362" width="32" height="14" rx="6" fill="#D0D0D0" stroke-width="2" />

        <!-- Plaque phare / Carénage frontal incliné -->
        <polygon points="628,255 672,250 702,328 655,332" fill="#E4E4E4" stroke-width="2.5" />

        <!-- Garde-boue avant Supermotard (Bec profilé) -->
        <path d="M 670 332 C 725 325, 785 338, 832 365 C 785 362, 735 358, 682 355 Z" fill="#E0E0E0" stroke-width="2.5" />
      </g>

      <!-- ========================================== -->
      <!-- D. RIG ARRIÈRE (Double Tour en V + Clamps) -->
      <!-- ========================================== -->
      <g>
        <!-- Tubes horizontaux bas (Fixés sur la boucle arrière) -->
        <rect x="315" y="320" width="165" height="18" rx="4" fill="#F2F2F2" stroke-width="2.2" />
        <ellipse cx="315" cy="329" rx="5" ry="9" fill="#D0D0D0" stroke-width="2" />
        <ellipse cx="338" cy="329" rx="6" ry="10" fill="#F2F2F2" stroke-width="2" />
        <ellipse cx="338" cy="329" rx="3" ry="5" fill="#181818" />

        <!-- Colliers de serrage aluminium bas (Kee Klamps) -->
        <rect x="366" y="314" width="22" height="28" rx="2" fill="#E5E5E5" stroke-width="2" />
        <rect x="392" y="316" width="20" height="26" rx="2" fill="#E5E5E5" stroke-width="2" />
        <rect x="452" y="316" width="22" height="24" rx="2" fill="#E5E5E5" stroke-width="2" />

        <!-- Mât Vertical Arrière (Gros tube principal) -->
        <path d="M 370 314 L 360 112 L 378 112 L 388 314 Z" fill="#F5F5F5" stroke-width="2.2" />
        <!-- Mousse de protection noire sur le mât vertical -->
        <path d="M 369 278 L 361 122 L 379 122 L 387 278 Z" fill="url(#foamGrip)" stroke-width="2.5" />
        <!-- Embout supérieur alu -->
        <rect x="358" y="106" width="20" height="12" rx="1" fill="#E5E5E5" stroke-width="1.8" />

        <!-- Mât Incliné Arrière (Jambe de force en V) -->
        <path d="M 454 316 L 398 138 L 412 134 L 468 316 Z" fill="#F5F5F5" stroke-width="2.2" />
        <!-- Mousse de protection sur le mât incliné -->
        <path d="M 446 290 L 402 148 L 416 144 L 460 286 Z" fill="url(#foamGrip)" stroke-width="2.5" />
        <!-- Raccord supérieur entre les deux mâts arrière -->
        <polygon points="378,125 408,125 408,142 378,138" fill="#E5E5E5" stroke-width="1.8" />
      </g>

      <!-- ========================================== -->
      <!-- E. GUIDON, FOURCHE INVERSÉE & ROUE AVANT   -->
      <!-- ========================================== -->
      <!-- Guidon & Commandes -->
      <g>
        <path d="M 525 245 L 585 248 L 622 258" stroke-width="6" />
        <!-- Poignée gauche + Levier de frein -->
        <rect x="524" y="240" width="35" height="9" rx="2" fill="#D8D8D8" stroke-width="2" />
        <path d="M 562 252 L 532 256" stroke-width="2.5" />
        <!-- Pontets & Té de fourche supérieur -->
        <rect x="595" y="248" width="28" height="16" rx="2" fill="#E5E5E5" stroke-width="2" />
        <!-- Extrémité droite du guidon -->
        <path d="M 672 260 L 718 272" stroke-width="5" />
      </g>

      <!-- Roue Avant Supermotard (En perspective 3/4) -->
      <g transform="translate(772, 548)">
        <!-- Bande de roulement et flanc du pneu -->
        <ellipse cx="10" cy="0" rx="82" ry="108" fill="#E8E8E8" stroke-width="3.5" />
        <!-- Sculptures subtiles sur le pneu avant -->
        <path d="M 65 -72 C 78 -65, 86 -52, 90 -40" stroke-width="1.5" opacity="0.6" />
        <path d="M 82 -25 C 90 -15, 92 0, 92 15" stroke-width="1.5" opacity="0.6" />
        <path d="M 75 45 C 82 55, 80 70, 70 82" stroke-width="1.5" opacity="0.6" />

        <ellipse cx="-4" cy="0" rx="76" ry="105" fill="#F5F5F5" stroke-width="2.5" />
        <!-- Jante -->
        <ellipse cx="-6" cy="0" rx="58" ry="80" stroke-width="3.5" />
        <ellipse cx="-6" cy="0" rx="51" ry="71" stroke-width="1.8" />

        <!-- Rayons roue avant (24 rayons croisés) -->
        <g stroke-width="1.1" opacity="0.7">
          <line x1="-6" y1="0" x2="-6" y2="-71" /><line x1="-6" y1="0" x2="18" y2="-66" />
          <line x1="-6" y1="0" x2="36" y2="-48" /><line x1="-6" y1="0" x2="44" y2="-20" />
          <line x1="-6" y1="0" x2="45" y2="12" /><line x1="-6" y1="0" x2="38" y2="42" />
          <line x1="-6" y1="0" x2="22" y2="62" /><line x1="-6" y1="0" x2="-4" y2="71" />
          <line x1="-6" y1="0" x2="-28" y2="64" /><line x1="-6" y1="0" x2="-46" y2="44" />
          <line x1="-6" y1="0" x2="-55" y2="15" /><line x1="-6" y1="0" x2="-55" y2="-18" />
          <line x1="-6" y1="0" x2="-46" y2="-46" /><line x1="-6" y1="0" x2="-28" y2="-65" />
          <!-- Croisements -->
          <line x1="12" y1="-15" x2="-38" y2="-54" /><line x1="-22" y1="-15" x2="28" y2="-54" />
          <line x1="12" y1="15" x2="-38" y2="54" /><line x1="-22" y1="15" x2="28" y2="54" />
        </g>

        <!-- Disque de frein Wave avant -->
        <ellipse cx="4" cy="0" rx="36" ry="48" stroke-width="2.5" stroke-dasharray="10 4" fill="#EAEAEA" fill-opacity="0.5" />
        <ellipse cx="4" cy="0" rx="24" ry="32" stroke-width="1.2" stroke-dasharray="4 4" />
        <!-- Moyeu avant -->
        <ellipse cx="-6" cy="0" rx="12" ry="16" fill="#DEDEDE" stroke-width="2.5" />
      </g>

      <!-- Fourche Inversée (Deux tubes parallèles + Pieds de fourche) -->
      <g>
        <!-- Tube de fourche Droit (Arrière-plan) -->
        <path d="M 652 285 L 718 442 L 732 436 L 666 280 Z" fill="#EAEAEA" stroke-width="2" />
        <path d="M 720 442 L 758 532 L 768 528 L 730 438 Z" fill="#F8F8F8" stroke-width="2" />

        <!-- Tube de fourche Gauche (Premier plan) -->
        <path d="M 616 285 L 682 452 L 698 446 L 632 278 Z" fill="#E2E2E2" stroke-width="2.5" />
        <!-- Plongeur inférieur + Pied de fourche -->
        <path d="M 685 452 L 725 548 L 737 543 L 696 447 Z" fill="#F8F8F8" stroke-width="2.2" />
        <rect x="720" y="538" width="24" height="22" rx="3" transform="rotate(-22 732 549)" fill="#E0E0E0" stroke-width="2.2" />
        <circle cx="734" cy="552" r="4" fill="#181818" />

        <!-- Durite de frein avant courbée -->
        <path d="M 685 335 C 725 365, 755 430, 745 520" stroke-width="2.2" />
      </g>

      <!-- ========================================== -->
      <!-- F. RIG AVANT (Arche Treillis + Double Tour)-->
      <!-- ========================================== -->
      <g>
        <!-- Arche Courbée en Treillis (Relie le cadre aux tours avant) -->
        <path d="M 598 295 C 595 215, 615 182, 725 162" stroke-width="14" stroke="#181818" />
        <path d="M 598 295 C 595 215, 615 182, 725 162" stroke-width="9" stroke="#F5F5F5" />
        <path d="M 622 292 C 620 230, 638 202, 725 182" stroke-width="8" stroke="#181818" />
        <!-- Triangulation interne du treillis -->
        <line x1="605" y1="245" x2="625" y2="255" stroke-width="3" />
        <line x1="615" y1="212" x2="635" y2="225" stroke-width="3" />
        <line x1="638" y1="192" x2="655" y2="208" stroke-width="3" />
        <line x1="668" y1="178" x2="682" y2="195" stroke-width="3" />

        <!-- Barre Transversale Horizontale Basse (Devant la plaque phare) -->
        <path d="M 678 300 L 802 315 L 800 334 L 675 318 Z" fill="#DFDFDF" stroke-width="2.5" />
        <ellipse cx="676" cy="309" rx="5" ry="9" fill="#181818" />

        <!-- Mât Avant Principal (Vertical) -->
        <path d="M 724 72 L 732 308 L 748 308 L 742 72 Z" fill="#EAEAEA" stroke-width="2.5" />
        <line x1="730" y1="85" x2="737" y2="300" stroke-width="1.2" opacity="0.6" />
        <!-- Collier supérieur Alu -->
        <rect x="721" y="70" width="23" height="22" rx="2" fill="#E5E5E5" stroke-width="2" />
        <!-- Collier intermédiaire (Jonction avec l'arche) -->
        <rect x="718" y="160" width="28" height="14" rx="2" fill="#E5E5E5" stroke-width="2" />
        <!-- Collier bas + Écrou papillon (Wingnut) -->
        <rect x="726" y="302" width="26" height="28" rx="2" fill="#E5E5E5" stroke-width="2" />
        <path d="M 739 330 L 732 342 M 739 330 L 746 342" stroke-width="2" />

        <!-- Mât Avant Secondaire (Incliné à droite) -->
        <path d="M 752 76 L 788 312 L 800 310 L 764 74 Z" fill="#EAEAEA" stroke-width="2.2" />
        <!-- Colliers haut et bas du 2e mât -->
        <rect x="750" y="74" width="16" height="18" rx="1" fill="#E5E5E5" stroke-width="1.8" />
        <rect x="784" y="292" width="22" height="36" rx="2" fill="#E5E5E5" stroke-width="2" />
        <ellipse cx="806" cy="322" rx="5" ry="9" fill="#D5D5D5" stroke-width="2" />
      </g>

    </g>

    <!-- 5. CADRE VIEWFINDER OPTIQUE DISCRET -->
    <g stroke="#181818" fill="none" opacity="0.22" stroke-width="2">
      <path d="M 230 110 L 230 85 L 255 85" />
      <path d="M 910 110 L 910 85 L 885 85" />
      <path d="M 230 665 L 230 690 L 255 690" />
      <path d="M 910 665 L 910 690 L 885 690" />
    </g>
  </g>
</svg>