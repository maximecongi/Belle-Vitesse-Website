openapi: 3.0.0
info:
  title: Belle Vitesse API
  description: API de gestion pour Belle Vitesse (Authentification, Inspections, Décharges, Administratif).
  version: 1.0.0
servers:
  - url: /api/v1
    description: Serveur local / Production

tags:
  - name: Authentification
    description: Connexion et gestion de session via JWT
  - name: Inspections
    description: Gestion des check-outs et check-ins des véhicules
  - name: Décharges
    description: Gestion des décharges pilotes et productions (PDF & Signatures)
  - name: Administratif
    description: Gestion des productions, contacts, projets et calendrier

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        firstname: { type: string }
        lastname: { type: string }
        mail: { type: string }
        phone: { type: string }
        job: { type: string }
        role: { type: string }

    Production:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        mail: { type: string }
        phone: { type: string }

    Contact:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        mail: { type: string }
        production_id: { type: integer }
        job_title: { type: string }

    Project:
      type: object
      properties:
        id: { type: integer }
        project_id: { type: string }
        name: { type: string }
        production_id: { type: integer }
        pilot_contact_id: { type: integer }
        production_contact_id: { type: integer }
        dop_contact_id: { type: integer }
        first_ac_contact_id: { type: integer }
        key_grip_contact_id: { type: integer }
        departure_date: { type: string, format: date }
        shoot_start_date: { type: string, format: date }
        shoot_end_date: { type: string, format: date }
        return_date: { type: string, format: date }
        vehicles_to_check: { type: string }

    Inspection:
      type: object
      properties:
        id: { type: integer }
        inspection_number: { type: string }
        status: { type: string }
        project_id: { type: integer }
        controller_id: { type: integer }
        inspection_date: { type: string, format: date }
        vehicle_id: { type: string }
        battery_level: { type: integer }
        vehicle_ready: { type: boolean }
        notes: { type: string }
        created_at: { type: string, format: date-time }

    PilotWaiver:
      type: object
      properties:
        id: { type: integer }
        waiver_id: { type: string, example: "BVDW-XXXX" }
        project_id: { type: integer }
        status:
          type: string
          enum: [to_generate, generated, sent, signed]
        generated_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        signed_at: { type: string, format: date-time }
        pilot_first_name: { type: string }
        pilot_last_name: { type: string }

    ProductionWaiver:
      type: object
      properties:
        id: { type: integer }
        waiver_id: { type: string, example: "BVPW-XXXX" }
        project_id: { type: integer }
        status:
          type: string
          enum: [to_generate, generated, sent, signed]
        generated_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time }
        signed_at: { type: string, format: date-time }
        production_name: { type: string }

    Message:
      type: object
      properties:
        message: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }

security:
  - bearerAuth: []

paths:
  # ── Authentification ──────────────────────────────────────────

  /auth/login:
    post:
      summary: Connexion par lien magique
      tags: [Authentification]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        200:
          description: Lien envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        400:
          description: Email manquant

  /auth/verify/{token}:
    get:
      summary: Échange du lien magique contre un JWT
      tags: [Authentification]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: JWT généré
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        401:
          description: Invalide ou expiré

  /auth/me:
    get:
      summary: Session utilisateur actuelle
      tags: [Authentification]
      responses:
        200:
          description: Profil utilisateur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # ── Inspections (Checkouts/Checkins) ──────────────────────────

  /checkouts:
    get:
      summary: Liste des check-outs
      tags: [Inspections]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkouts:
                    type: array
                    items: { $ref: '#/components/schemas/Inspection' }
    post:
      summary: Créer un check-out
      tags: [Inspections]
      responses:
        201:
          description: Créé
  
  /checkouts/{id}:
    get:
      summary: Détail d'un check-out
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Détail
    put:
      summary: Modifier un check-out
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Mis à jour
    delete:
      summary: Supprimer un check-out
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Supprimé

  /checkouts/{id}/status:
    patch:
      summary: Changer le statut d'un check-out
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        200:
          description: Succès

  /checkouts/{id}/finalize:
    post:
      summary: Finaliser un check-out (Signature)
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [signature_data]
              properties:
                signature_data: { type: string, description: "Données de signature (Base64)" }
                token: { type: string, description: "Optionnel: Token de session de signature" }
      responses:
        200:
          description: Finalisé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document_id: { type: string }
                  pdf_url: { type: string }

  /checkins:
    get:
      summary: Liste des check-ins
      tags: [Inspections]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkins:
                    type: array
                    items: { $ref: '#/components/schemas/Inspection' }
    post:
      summary: Créer un check-in
      tags: [Inspections]
      responses:
        201:
          description: Créé

  /checkins/{id}:
    get:
      summary: Détail d'un check-in
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Détail
    put:
      summary: Modifier un check-in
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Mis à jour
    delete:
      summary: Supprimer un check-in
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Supprimé

  /checkins/{id}/status:
    patch:
      summary: Changer le statut d'un check-in
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
      responses:
        200:
          description: Succès

  /checkins/{id}/finalize:
    post:
      summary: Finaliser un check-in (Signature)
      tags: [Inspections]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [signature_data]
              properties:
                signature_data: { type: string, description: "Données de signature (Base64)" }
                token: { type: string, description: "Optionnel: Token de session de signature" }
      responses:
        200:
          description: Finalisé avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document_id: { type: string }
                  pdf_url: { type: string }

  # ── Décharges ─────────────────────────────────────────────────

  /pilot-waivers:
    get:
      summary: Liste des décharges pilotes
      tags: [Décharges]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PilotWaiver' }
    post:
      summary: Créer une décharge pilote
      tags: [Décharges]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: { type: integer }
      responses:
        201:
          description: Créée

  /pilot-waivers/{id}/generate:
    post:
      summary: Générer le PDF pilote
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: PDF généré

  /pilot-waivers/{id}/send:
    post:
      summary: Envoyer la décharge pilote
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Envoyée

  /pilot-waivers/{id}/reset:
    post:
      summary: Réinitialiser la décharge pilote
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Réinitialisée

  /pilot-waivers/{id}/finalize:
    post:
      summary: Finaliser une décharge pilote (Signature & Data)
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [signature_data]
              properties:
                signature_data: { type: string, description: "Base64 signature" }
                first_name: { type: string }
                last_name: { type: string }
                dob: { type: string, format: date }
                license_number: { type: string }
                address: { type: string }
                insurance_company: { type: string }
                insurance_policy: { type: string }
      responses:
        200:
          description: Finalisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document_id: { type: string }
                  pdf_url: { type: string }

  /production-waivers:
    get:
      summary: Liste des décharges production
      tags: [Décharges]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductionWaiver' }
    post:
      summary: Créer une décharge production
      tags: [Décharges]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id: { type: integer }
      responses:
        201:
          description: Créée

  /production-waivers/{id}/generate:
    post:
      summary: Générer le PDF production
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: PDF généré

  /production-waivers/{id}/send:
    post:
      summary: Envoyer la décharge production
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Envoyée

  /production-waivers/{id}/reset:
    post:
      summary: Réinitialiser la décharge production
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Réinitialisée

  /production-waivers/{id}/finalize:
    post:
      summary: Finaliser une décharge production (Signature & Data)
      tags: [Décharges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [signature_data]
              properties:
                signature_data: { type: string, description: "Base64 signature" }
                production_name: { type: string }
                representative: { type: string }
                address: { type: string }
                siret: { type: string }
                vat_number: { type: string }
                insurance_company: { type: string }
                insurance_policy: { type: string }
      responses:
        200:
          description: Finalisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  document_id: { type: string }
                  pdf_url: { type: string }

  # ── Administratif ─────────────────────────────────────────────

  /projects:
    get:
      summary: Lister les projets
      tags: [Administratif]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
    post:
      summary: Créer un projet
      tags: [Administratif]
      responses:
        201:
          description: Créé

  /projects/{id}:
    get:
      summary: Détail d'un projet
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Détail
    put:
      summary: Modifier un projet
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Mis à jour
    delete:
      summary: Supprimer un projet
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Supprimé

  /productions:
    get:
      summary: Lister les productions
      tags: [Administratif]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Production' }
    post:
      summary: Créer une production
      tags: [Administratif]
      responses:
        201:
          description: Créée

  /productions/{id}:
    get:
      summary: Détail d'une production
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Détail
    put:
      summary: Modifier une production
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Mis à jour
    delete:
      summary: Supprimer une production
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Supprimée

  /contacts:
    get:
      summary: Lister les contacts
      tags: [Administratif]
      responses:
        200:
          description: Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
    post:
      summary: Créer un contact
      tags: [Administratif]
      responses:
        201:
          description: Créé

  /contacts/{id}:
    get:
      summary: Détail d'un contact
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Détail
    put:
      summary: Modifier un contact
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Mis à jour
    delete:
      summary: Supprimer un contact
      tags: [Administratif]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        200:
          description: Supprimé

  /calendar/events:
    get:
      summary: Événements du calendrier
      tags: [Administratif]
      responses:
        200:
          description: Liste d'événements
          content:
            application/json:
              schema:
                type: array
                items: { type: object }

  /api/v1/meta/vehicles:
    get:
      summary: Liste les véhicules (discovery)
      tags: [Meta]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste des véhicules simplifiée
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    slug: { type: string }
                    unique_id: { type: string }
                    plate: { type: string }
                    brand: { type: string }
                    model: { type: string }
                    type: { type: string }
                    image_url: { type: string }

  /api/v1/meta/inspection-context:
    get:
      summary: Contexte complet pour inspections
      description: Retourne les projets, véhicules, utilisateurs et mapping de contrôles nécessaires pour créer une inspection.
      tags: [Meta]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Données de contexte d'inspection
          content:
            application/json:
              schema:
                type: object

  /api/v1/meta/static-data:
    get:
      summary: Données statiques et traductions
      tags: [Meta]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contenu statique, têtes, catégories et mapping de statuts
          content:
            application/json:
              schema:
                type: object
